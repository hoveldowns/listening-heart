databases:
  - name: listening-heart-db
    databaseName: listening_heart
    user: listening_heart

services:
  - type: web
    name: listening-heart
    runtime: node
    buildCommand: yarn install
    startCommand: yarn start
    envVars:
      - key: NOTE_PRICE
        value: 1000
      - key: NETWORK
        value: eip155:8453
      - key: FACILITATOR_URL
        value: https://facilitator.daydreams.systems
      - key: TASKMARKET_API
        value: https://api.taskmarket.dev
      - key: FALLBACK_WALLET
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: listening-heart-db
          property: connectionString
