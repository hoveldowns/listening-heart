databases:
  - name: listening-heart-db
    databaseName: listening_heart
    user: listening_heart

services:
  - type: web
    name: listening-heart
    runtime: node
    buildCommand: yarn install
    startCommand: yarn start
    envVars:
      - key: PORT
        value: 3000
      - key: NOTE_PRICE
        value: 1000
      - key: FACILITATOR_URL
        value: https://x402.org/facilitator
      - key: FALLBACK_WALLET
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: listening-heart-db
          property: connectionString
